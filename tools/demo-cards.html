<!doctype html><html lang="it"><head><meta charset="utf-8">
<title>Schede dei lavori — sorgente</title>
<!-- Ogni sezione è 1200x900. Si rende tutta la pagina in una striscia
     (1200x6300) e la si taglia con tools/slice-cards.py.
     Colori e caratteri sono quelli veri dei rispettivi repo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Bricolage+Grotesque:wght@700;800&family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@600;700&family=Roboto:wght@500;700&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px}
.card{width:1200px;height:900px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.art{height:400px;display:flex;align-items:center;justify-content:center}
.art img{max-height:400px;max-width:560px;object-fit:contain;display:block}
.name{margin-top:52px;font-size:78px;line-height:1;letter-spacing:-.025em;text-align:center}
.sw{position:absolute;bottom:74px;display:flex;gap:20px}
.sw i{width:48px;height:48px;border-radius:50%;display:block;
  box-shadow:inset 0 0 0 1px var(--ring,rgba(255,255,255,.2))}
.ss-arc{position:relative;width:560px;height:300px}
.ss-bars{display:flex;gap:11px;align-items:flex-end;justify-content:center;margin-top:26px}
.ss-bars b{width:30px;border-radius:5px;display:block}
.ring{width:380px;height:380px;border-radius:50%;
  background:conic-gradient(#ff4fd8,#9b7bff,#56c2ff,#4fe3b4,#ffd23f,#ff6b81,#ff4fd8);
  -webkit-mask:radial-gradient(circle,transparent 45%,#000 46%);
          mask:radial-gradient(circle,transparent 45%,#000 46%)}
.glow{position:absolute;width:620px;height:620px;border-radius:50%;filter:blur(120px);opacity:.38;
  background:conic-gradient(#ff4fd8,#9b7bff,#56c2ff,#4fe3b4,#ffd23f,#ff6b81,#ff4fd8)}
.grad-text{background:linear-gradient(96deg,#56c2ff,#9b7bff 40%,#ff4fd8 75%,#ffd23f);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.rounded{border-radius:96px}
</style></head><body>

<!-- 1 · Torino Sul Filo -->
<section class="card" style="--bg:#0a0c14;--ink:#fff">
  <div class="art"><img src="_demo/tsf.png" alt="" style="width:470px;max-width:none"></div>
  <div class="name" style="font-family:'Inter',sans-serif;font-weight:700;text-transform:uppercase;font-size:60px;letter-spacing:.04em">Torino Sul Filo</div>
  <div class="sw"><i style="background:#ff7a30"></i><i style="background:#ff9147"></i><i style="background:#3987e5"></i><i style="background:#f2f2f7"></i><i style="background:#121520"></i></div>
</section>
<!-- 2 · Pachamar Yoga -->
<section class="card" style="--bg:#f7f2e8;--ink:#2b382f;--ring:rgba(43,56,47,.22)">
  <div class="art"><img src="_demo/pachamar.png" alt="" style="max-height:450px;max-width:450px"></div>
  <div class="name" style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:88px">Pachamar Yoga</div>
  <div class="sw"><i style="background:#b26a3d"></i><i style="background:#7d8b6f"></i><i style="background:#2b382f"></i><i style="background:#efe6d4"></i><i style="background:#f7f2e8"></i></div>
</section>
<!-- 3 · Strati -->
<section class="card" style="--bg:linear-gradient(170deg,#1b2b4a,#101318 68%);--ink:#d9e2f5">
  <div class="art"><img src="_demo/strati.png" alt="" style="max-height:330px"></div>
  <div class="name" style="font-family:'Roboto',sans-serif;font-weight:500;font-size:76px">Strati</div>
  <div class="sw"><i style="background:#e8c07c"></i><i style="background:#a9761f"></i><i style="background:#afc4ec"></i><i style="background:#35476b"></i><i style="background:#101318"></i></div>
</section>
<!-- 4 · Sun Seeker -->
<section class="card" style="--bg:radial-gradient(120% 90% at 50% 0%,#111b2e,#05090f 70%);--ink:#fff6de">
  <div class="art" style="flex-direction:column;height:440px">
    <svg class="ss-arc" viewBox="0 0 560 300" fill="none">
      <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#cf7a02"/><stop offset=".5" stop-color="#ffb930"/><stop offset="1" stop-color="#ffd470"/></linearGradient>
        <radialGradient id="s"><stop offset="0" stop-color="#fff6de"/><stop offset=".45" stop-color="#ffd470"/><stop offset="1" stop-color="#ffb930" stop-opacity="0"/></radialGradient></defs>
      <path d="M40 268 A 240 240 0 0 1 520 268" stroke="#1a273f" stroke-width="10" stroke-linecap="round"/>
      <path d="M40 268 A 240 240 0 0 1 400 63" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="400" cy="63" r="72" fill="url(#s)" opacity=".85"/><circle cx="400" cy="63" r="21" fill="#fff6de"/>
    </svg>
    <div class="ss-bars">
      <b style="height:34px;background:#1a273f"></b><b style="height:56px;background:#cf7a02"></b>
      <b style="height:92px;background:#ffb930"></b><b style="height:120px;background:#ffd470"></b>
      <b style="height:102px;background:#ffb930"></b><b style="height:66px;background:#f59a05"></b>
      <b style="height:38px;background:#1a273f"></b></div>
  </div>
  <div class="name" style="font-family:'Fraunces',serif;font-weight:600;margin-top:38px">Sun Seeker</div>
  <div class="sw"><i style="background:#ffd470"></i><i style="background:#ffb930"></i><i style="background:#f59a05"></i><i style="background:#1a273f"></i><i style="background:#05090f"></i></div>
</section>
<!-- 5 · One Piece Watcher -->
<section class="card" style="--bg:#08090c;--ink:#fff">
  <div class="art"><img class="rounded" src="_demo/opw.png" alt="" style="max-height:360px"></div>
  <div class="name" style="font-family:'Inter',sans-serif;font-weight:600;font-size:62px">One Piece Watcher</div>
  <div class="sw"><i style="background:#0a84ff"></i><i style="background:#e8b71a"></i><i style="background:#d0332f"></i><i style="background:#f5f5f7"></i><i style="background:#1c1c1e"></i></div>
</section>
<!-- 6 · Appunti -->
<section class="card" style="--bg:#0a0d12;--ink:#e9ecf1">
  <div class="art"><img class="rounded" src="_demo/appunti.png" alt="" style="max-height:340px"></div>
  <div class="name" style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:70px">Appunti</div>
  <div class="sw"><i style="background:#14b8a6"></i><i style="background:#0d9488"></i><i style="background:#1a212b"></i><i style="background:#12171f"></i><i style="background:#e9ecf1"></i></div>
</section>
<!-- 7 · Frushío -->
<section class="card" style="--bg:#08060e;--ink:#fff">
  <div class="art" style="position:relative"><div class="glow"></div><div class="ring"></div></div>
  <div class="name grad-text" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:92px">Frushío</div>
  <div class="sw"><i style="background:#ff4fd8"></i><i style="background:#9b7bff"></i><i style="background:#56c2ff"></i><i style="background:#4fe3b4"></i><i style="background:#ffd23f"></i></div>
</section>

</body></html>
