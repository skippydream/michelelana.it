<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n-key="error.title">Pagina non trovata | Michele Lana</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/assets/js/i18n.js?v=20261126a"></script>
<script>
  (function () {
    var saved = null;
    try {
      var value = localStorage.getItem('michelelana-theme');
      if (value === 'light' || value === 'dark') saved = value;
    } catch (e) {}
    if (saved) document.documentElement.setAttribute('data-theme', saved);

    /* Stessa scelta della home: niente flash del tema sbagliato. */
    window.__themeMedia = function (choice) {
      var dark = choice === 'dark' ||
        (choice === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      Array.prototype.forEach.call(metas, function (meta, i) {
        var darkMeta = i === 1;
        meta.setAttribute('media', choice === 'auto'
          ? (darkMeta ? '(prefers-color-scheme: dark)' : '(prefers-color-scheme: light)')
          : (dark === darkMeta ? 'all' : 'not all'));
      });
    };
    if (saved) window.__themeMedia(saved);
  })();
</script>
<style>
  @font-face{font-family:'Geist';font-style:normal;font-weight:100 900;font-display:swap;src:url(/assets/fonts/geist-normal.woff2) format('woff2')}
  :root{
    --ink:#000;
    --mut:rgba(0,0,0,.55);
    --line:rgba(0,0,0,.12);
    --bg:#fff;
    --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#f2f3f5;
      --mut:rgba(242,243,245,.55);
      --line:rgba(242,243,245,.18);
      --bg:#14161a;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#f2f3f5;
    --mut:rgba(242,243,245,.55);
    --line:rgba(242,243,245,.18);
    --bg:#14161a;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:6px}
  body{display:grid;place-items:center}
  .error{width:min(1000px,calc(100% - 300px));font-weight:200}
  .error h1{font-size:40px;font-weight:400;letter-spacing:-.03em}
  .error p{margin-top:14px;font-size:20px;color:var(--mut)}
  .error a{display:inline-block;margin-top:40px;padding-bottom:2px;font-size:20px;border-bottom:1px solid var(--line)}
  .error a:hover{color:var(--ink);border-color:var(--ink)}
  @media(max-width:600px){.error{width:calc(100% - 40px)}.error h1{font-size:32px}}
</style>
</head>
<body>
<main class="error">
  <h1>404.</h1>
  <p>Questa pagina non esiste.</p>
  <a href="/">Torna alla home <span aria-hidden="true">&#8594;</span></a>
</main>
</body>
</html>
